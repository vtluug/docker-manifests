services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "993" # render group, see readme
    volumes:
      - /etc/ipa/ca.crt:/etc/jfin/ldap_ca.crt:ro
      - /opt/jerryfin/config:/config
      - /opt/jerryfin/cache:/cache
      - /nfs/cistern/share/media/music:/music
      - /nfs/cistern/share/torrent-dl:/nfs/cistern/share/torrent-dl
      - /nfs/cistern/share/media/movies:/nfs/cistern/share/media/movies
      - /nfs/cistern/share/media/tvshows:/nfs/cistern/share/media/tvshows
      - /nfs/cistern/share/jellyfin/symlinked-shows:/tvshows
      - /nfs/cistern/share/jellyfin/symlinked-movies:/movies
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # see readme
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=https://watch.vtluug.org
    network_mode: "host"
