services:
  mc:
    image: itzg/minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PURPUR"
      DIFFICULTY: "normal" 
      SERVER_NAME: "VTLUUGsmp"
      ICON: "https://vtluug.org/w/images/thumb/a/a5/Hokie_tux.png/711px-Hokie_tux.png"
      OPS: |
        Isotton1

      SPIGET_RESOURCES: 80128 #PasswordProtect
      
    volumes:
      # attach the relative directory 'data' to the container' /data path
      - /nfs/cistern/docker/data/minecraft/data:/data
      - ./plugins:/plugins
